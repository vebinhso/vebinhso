name: Verify website build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
      - name: Check OCR input tests
        run: npx vitest run src/lib/classroom-ocr.test.ts
      - name: Check dependency lock consistency
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::warning::package-lock.json needs regeneration and commit before merge"
          fi
      - name: Check production build
        run: npm run build
