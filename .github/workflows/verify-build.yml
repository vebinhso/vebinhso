name: Verify website build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
      - name: Check OCR input tests
        run: npx vitest run src/lib/classroom-ocr.test.ts
      - name: Export updated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 3
      - name: Check production build
        run: npm run build
      - name: Commit regenerated lockfile on explicit manual run
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'experiment/classroom-ocr-20261024'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize OCR dependency lockfile'
            git push origin HEAD:experiment/classroom-ocr-20261024
          fi
      - name: Require committed dependency lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json differs from npm install output. Download generated-package-lock artifact and commit it before merge."
            exit 1
          fi
